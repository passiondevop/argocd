apiVersion: v1
kind: Namespace
metadata:
  name: stagens
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-stable
  namespace: stagens
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-preview
  namespace: stagens
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-rollout
  namespace: stagens
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.26
          ports:
            - containerPort: 80

  strategy:
    blueGreen:
      activeService: nginx-stable
      previewService: nginx-preview
      autoPromotionEnabled: false

