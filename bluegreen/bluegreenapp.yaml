apiVersion: v1
kind: Namespace
metadata:
  name: devprojectns
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kuard
  namespace: devprojectns
  labels:
    app: kuard
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: kuard
  template:
    metadata:
      labels:
        app: kuard
    spec:
      containers:
        - name: kuard
          image: gcr.io/kuar-demo/kuard-amd64:blue   # change to :green to trigger blue-green rollout
          ports:
            - containerPort: 8080
  strategy:
    blueGreen:
      activeService: kuardsvc
      previewService: kuardsvc-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
---
# ACTIVE (production) - browser: http://<node-external-ip>:30080
apiVersion: v1
kind: Service
metadata:
  name: kuardsvc
  namespace: devprojectns
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  selector:
    app: kuard
---
# PREVIEW (test before promoting) - browser: http://<node-external-ip>:30081
apiVersion: v1
kind: Service
metadata:
  name: kuardsvc-preview
  namespace: devprojectns
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
  selector:
    app: kuard
